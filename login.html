<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="description" content="Masuk ke Dashboard Cycle Time Perilisan" />
  <title>Masuk — Cycle Time Perilisan</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cycle Time" />
  <meta property="og:title" content="Cycle Time Perilisan" />
  <meta property="og:image" content="icons/og-image.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-100 to-blue-100 text-slate-900 antialiased flex items-center justify-center p-4">

  <main class="w-full max-w-md">
    <div class="flex flex-col items-center text-center mb-6">
      <img src="icons/icon-192x192.png" alt="Logo Cycle Time Perilisan" class="w-16 h-16 rounded-2xl shadow-md" width="64" height="64" />
      <h1 class="mt-4 text-2xl font-extrabold tracking-tight">Cycle Time Perilisan</h1>
      <p class="text-sm text-slate-500 mt-1">Masuk untuk membuka dashboard</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-7">
      <div id="alert" class="hidden mb-4 rounded-xl border px-3.5 py-2.5 text-sm" role="alert"></div>

      <form id="login-form" class="flex flex-col gap-4" novalidate>
        <div>
          <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email</label>
          <input id="email" type="email" autocomplete="username" required placeholder="nama@perusahaan.com"
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Kata Sandi</label>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"
              class="w-full rounded-xl border border-slate-300 pl-3.5 pr-16 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 px-3.5 text-xs font-semibold text-slate-500 hover:text-slate-800" aria-label="Tampilkan kata sandi">Lihat</button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3">
          <label class="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
            <input id="remember" type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
            Ingat saya
          </label>
          <button type="button" id="forgot" class="text-sm font-semibold text-blue-600 hover:text-blue-700">Lupa sandi?</button>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold py-2.5 transition">
          Masuk
        </button>
      </form>

      <div class="flex items-center gap-3 my-5">
        <div class="h-px flex-1 bg-slate-200"></div>
        <span class="text-xs text-slate-400 font-medium">atau</span>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <button type="button" id="google-btn"
        class="w-full rounded-xl border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-60 disabled:cursor-not-allowed text-sm font-semibold text-slate-800 py-2.5 transition inline-flex items-center justify-center gap-2.5">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Masuk dengan Google
      </button>
    </div>

    <p class="text-center text-xs text-slate-400 mt-5">Akun dibuat oleh administrator. Hubungi admin jika belum punya akses.</p>
  </main>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail,
      GoogleAuthProvider, signInWithPopup, setPersistence,
      browserLocalPersistence, browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBCgauuitX89coLfFSd6hBG1wR8NfebBSg",
      authDomain: "brftxcycletime.firebaseapp.com",
      projectId: "brftxcycletime",
      storageBucket: "brftxcycletime.firebasestorage.app",
      messagingSenderId: "434471197911",
      appId: "1:434471197911:web:3d7c4028763d9d03816492",
      measurementId: "G-W2TXSEHFJB"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    auth.languageCode = "id";

    // Analytics dimuat terpisah agar kegagalan (offline / diblokir adblock) tidak mengganggu login
    import("https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js")
      .then(({ getAnalytics }) => getAnalytics(app))
      .catch(() => {});

    const $ = (id) => document.getElementById(id);
    const form = $("login-form"), emailEl = $("email"), pwEl = $("password");
    const submitBtn = $("submit-btn"), googleBtn = $("google-btn"), alertEl = $("alert");

    const ERRORS = {
      "auth/invalid-credential": "Email atau kata sandi salah.",
      "auth/wrong-password": "Email atau kata sandi salah.",
      "auth/user-not-found": "Email atau kata sandi salah.",
      "auth/invalid-email": "Format email tidak valid.",
      "auth/user-disabled": "Akun ini dinonaktifkan. Hubungi administrator.",
      "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi beberapa menit lagi.",
      "auth/network-request-failed": "Tidak ada koneksi internet. Periksa jaringan Anda.",
      "auth/popup-blocked": "Pop-up diblokir browser. Izinkan pop-up lalu coba lagi.",
      "auth/unauthorized-domain": "Domain ini belum diizinkan di Firebase (Authentication > Settings > Authorized domains).",
      "auth/operation-not-allowed": "Metode masuk ini belum diaktifkan di Firebase Console."
    };
    const IGNORED = ["auth/popup-closed-by-user", "auth/cancelled-popup-request"];

    function showAlert(msg, type = "error") {
      alertEl.textContent = msg;
      alertEl.className = "mb-4 rounded-xl border px-3.5 py-2.5 text-sm " +
        (type === "error" ? "bg-red-50 border-red-200 text-red-700" : "bg-emerald-50 border-emerald-200 text-emerald-700");
    }
    function clearAlert() { alertEl.className = "hidden"; }
    function setBusy(busy) {
      submitBtn.disabled = busy; googleBtn.disabled = busy;
      submitBtn.textContent = busy ? "Memproses…" : "Masuk";
    }
    function fail(err) {
      if (IGNORED.includes(err.code)) return;
      showAlert(ERRORS[err.code] || ("Terjadi kesalahan (" + (err.code || err.message) + ")."));
    }
    async function applyPersistence() {
      await setPersistence(auth, $("remember").checked ? browserLocalPersistence : browserSessionPersistence);
    }

    // Sudah login? langsung ke dashboard
    onAuthStateChanged(auth, (user) => { if (user) location.replace("index.html"); });

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); clearAlert();
      const email = emailEl.value.trim(), password = pwEl.value;
      if (!email || !password) return showAlert("Email dan kata sandi wajib diisi.");
      setBusy(true);
      try {
        await applyPersistence();
        await signInWithEmailAndPassword(auth, email, password);
        // redirect ditangani onAuthStateChanged
      } catch (err) { fail(err); setBusy(false); }
    });

    googleBtn.addEventListener("click", async () => {
      clearAlert(); setBusy(true);
      try {
        await applyPersistence();
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) { fail(err); setBusy(false); }
    });

    $("forgot").addEventListener("click", async () => {
      clearAlert();
      const email = emailEl.value.trim();
      if (!email) { emailEl.focus(); return showAlert("Isi email Anda dulu, lalu klik “Lupa sandi?”."); }
      try {
        await sendPasswordResetEmail(auth, email);
        showAlert("Jika email terdaftar, tautan reset kata sandi telah dikirim.", "success");
      } catch (err) { fail(err); }
    });

    $("toggle-pw").addEventListener("click", (e) => {
      const show = pwEl.type === "password";
      pwEl.type = show ? "text" : "password";
      e.currentTarget.textContent = show ? "Sembunyi" : "Lihat";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
