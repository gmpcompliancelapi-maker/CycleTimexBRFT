<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Offline — Cycle Time Perilisan</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --brand:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; --brand:#3b82f6; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
           background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { max-width:420px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px; text-align:center; }
    img { width:72px; height:72px; border-radius:18px; }
    h1 { font-size:20px; margin:16px 0 8px; }
    p { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 20px; }
    button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192x192.png" alt="Logo Cycle Time Perilisan" />
    <h1>Anda sedang offline</h1>
    <p>Halaman ini belum tersimpan di perangkat. Periksa koneksi internet lalu coba muat ulang.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
